name: CD - Development Deployment

on:
  push:
    branches: [ develop ]
    paths:
      - 'titanic-api/**'
      - 'part-2-kubernetes/**'
      - '.github/workflows/cd-dev.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL || '456128143446.dkr.ecr.eu-west-2.amazonaws.com/titanic-api/titanic-api-repo' }}
  K8S_NAMESPACE: titanic-api-dev
  K8S_ENVIRONMENT: dev

jobs:
  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_PROD }} --region ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Determine image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "tag=develop-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Kubernetes using Helm
        run: |
          helm upgrade --install titanic-api-dev \
            ./part-2-kubernetes/helm/titanic-api \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ env.ECR_REPOSITORY_URL }} \
            --set image.tag=${{ steps.image-tag.outputs.tag }} \
            --set image.pullPolicy=Always \
            --set namespace=${{ env.K8S_NAMESPACE }} \
            --set config.flaskEnv=development \
            --set replicaCount=1 \
            --set autoscaling.enabled=false \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=titanic-api-dev.example.com \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/titanic-api-dev -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}

      - name: Run smoke tests
        run: |
          SERVICE_URL=$(kubectl get ingress -n ${{ env.K8S_NAMESPACE }} titanic-api-dev -o jsonpath='{.spec.rules[0].host}')
          if [ -n "$SERVICE_URL" ]; then
            echo "Running smoke tests against $SERVICE_URL"
            curl -f http://$SERVICE_URL/health || echo "Health check failed"
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Development deployment successful"
          else
            echo "❌ Development deployment failed"
          fi

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: development

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_PROD }} --region ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Rollback deployment
        run: |
          helm rollback titanic-api-dev -n titanic-api-dev --wait --timeout 5m
          echo "Rollback completed"

      - name: Notify rollback
        run: |
          echo "⚠️ Development deployment rolled back due to failure"
