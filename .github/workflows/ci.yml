name: CI - Titanic API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}

jobs:
  application:
    name: Test and Lint Application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: titanic_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: titanic_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: titanic-api/requirements.txt

      - name: Install dependencies
        working-directory: titanic-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint for blocking Python errors
        working-directory: titanic-api
        run: flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        working-directory: titanic-api
        env:
          DATABASE_URL: postgresql+psycopg2://titanic_user:test_password@localhost:5432/titanic_db
          FLASK_ENV: production
        run: python -m pytest tests -v

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part-5-iac/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote state
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  security:
    name: Scan Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [application, terraform, security]
    if: github.event_name == 'push' && vars.ENABLE_IMAGE_PUSH == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: part-1-containerization/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
