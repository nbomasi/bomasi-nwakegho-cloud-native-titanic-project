name: CD - Staging Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (must exist in registry)'
        required: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL || '456128143446.dkr.ecr.eu-west-2.amazonaws.com/titanic-api/titanic-api-repo' }}
  K8S_NAMESPACE: titanic-api-staging
  K8S_ENVIRONMENT: staging

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_PROD }} --region ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Determine image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            # Use latest tag
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Verify image exists in ECR
        run: |
          IMAGE_TAG=${{ steps.image-tag.outputs.tag }}
          REPO_NAME=$(echo "${{ env.ECR_REPOSITORY_URL }}" | cut -d'/' -f2-)
          IMAGE_URI="${{ env.ECR_REPOSITORY_URL }}:${IMAGE_TAG}"
          echo "Verifying image exists in ECR: ${IMAGE_URI}"
          aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag=${IMAGE_TAG} \
            --region ${{ env.AWS_REGION }} || {
              echo "Error: Image ${IMAGE_URI} not found in ECR"
              echo "Available tags:"
              aws ecr list-images --repository-name "$REPO_NAME" --region ${{ env.AWS_REGION }} --query 'imageIds[*].imageTag' --output table || true
              exit 1
            }
          echo "✓ Image verified: ${IMAGE_URI}"

      - name: Run pre-deployment tests
        run: |
          echo "Running pre-deployment validation..."
          helm lint ./part-2-kubernetes/helm/titanic-api

      - name: Wait for ClusterSecretStore to be ready
        run: |
          echo "Checking if ClusterSecretStore exists..."
          if kubectl get clustersecretstore aws-secrets-manager &>/dev/null; then
            echo "ClusterSecretStore exists, checking readiness..."
            for i in {1..30}; do
              READY=$(kubectl get clustersecretstore aws-secrets-manager -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "Unknown")
              if [ "$READY" == "True" ]; then
                echo "✓ ClusterSecretStore is ready"
                break
              fi
              echo "Waiting for ClusterSecretStore to be ready... (attempt $i/30)"
              sleep 2
            done
            if [ "$READY" != "True" ]; then
              echo "⚠️ ClusterSecretStore may not be ready, but proceeding..."
              kubectl describe clustersecretstore aws-secrets-manager || true
            fi
          else
            echo "⚠️ ClusterSecretStore not found. It will be created by Helm hooks."
          fi

      - name: Fix existing secret Helm ownership (if exists)
        run: |
          SECRET_NAME="titanic-api-staging-secrets"
          if kubectl get secret "$SECRET_NAME" -n ${{ env.K8S_NAMESPACE }} &>/dev/null; then
            echo "Existing secret found. Adding Helm ownership metadata..."
            kubectl label secret "$SECRET_NAME" -n ${{ env.K8S_NAMESPACE }} \
              app.kubernetes.io/managed-by=Helm --overwrite || true
            kubectl annotate secret "$SECRET_NAME" -n ${{ env.K8S_NAMESPACE }} \
              meta.helm.sh/release-name=titanic-api-staging \
              meta.helm.sh/release-namespace=${{ env.K8S_NAMESPACE }} \
              --overwrite || true
            echo "✓ Helm ownership metadata added to existing secret"
          else
            echo "No existing secret found. ExternalSecret will create it with Helm labels."
          fi

      - name: Deploy to Kubernetes using Helm
        id: helm-deploy
        run: |
          helm upgrade --install titanic-api-staging \
            ./part-2-kubernetes/helm/titanic-api \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ env.ECR_REPOSITORY_URL }} \
            --set image.tag=${{ steps.image-tag.outputs.tag }} \
            --set image.pullPolicy=Always \
            --set namespace=${{ env.K8S_NAMESPACE }} \
            --set config.flaskEnv=staging \
            --set replicaCount=2 \
            --set autoscaling.enabled=false \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=titanic-api.iyere.site \
            --set ingress.annotations."cert-manager\.io/cluster-issuer"=letsencrypt-prod \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            --set ingress.hosts[0].paths[1].path=/health \
            --set ingress.hosts[0].paths[1].pathType=Exact \
            --set ingress.hosts[0].paths[2].path=/people \
            --set ingress.hosts[0].paths[2].pathType=Prefix \
            --set podDisruptionBudget.enabled=true \
            --set podDisruptionBudget.minAvailable=1 \
            --set database.enabled=false \
            --set externalSecrets.externalSecret.enabled=true \
            --set externalSecrets.externalSecret.secretName=titanic-api-prod-rds-credentials \
            --set externalSecrets.externalSecret.targetSecretName=titanic-api-staging-secrets \
            --set externalSecrets.secretStore.enabled=true \
            --wait \
            --timeout 15m \
            --atomic || {
              echo "Helm deployment failed, gathering diagnostics..."
              kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=titanic-api
              kubectl describe pods -n ${{ env.K8S_NAMESPACE }} -l app=titanic-api
              kubectl logs -n ${{ env.K8S_NAMESPACE }} -l app=titanic-api --tail=100 || true
              kubectl get events -n ${{ env.K8S_NAMESPACE }} --sort-by='.lastTimestamp' | tail -20
              exit 1
            }

      - name: Wait for ExternalSecret to sync
        run: |
          echo "Waiting for ExternalSecret to sync secrets from AWS Secrets Manager..."
          for i in {1..60}; do
            if kubectl get externalsecret titanic-api-staging-secrets -n ${{ env.K8S_NAMESPACE }} &>/dev/null; then
              SYNC_STATUS=$(kubectl get externalsecret titanic-api-staging-secrets -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "Unknown")
              if [ "$SYNC_STATUS" == "True" ]; then
                echo "✓ ExternalSecret synced successfully"
                kubectl get secret titanic-api-staging-secrets -n ${{ env.K8S_NAMESPACE }} || true
                break
              fi
              echo "Waiting for ExternalSecret to sync... (attempt $i/60) - Status: $SYNC_STATUS"
              if [ $i -le 10 ]; then
                kubectl describe externalsecret titanic-api-staging-secrets -n ${{ env.K8S_NAMESPACE }} | tail -20 || true
              fi
            else
              echo "ExternalSecret not found yet... (attempt $i/60)"
            fi
            sleep 5
          done
          if [ "$SYNC_STATUS" != "True" ]; then
            echo "⚠️ ExternalSecret may not have synced, checking status..."
            kubectl get externalsecret titanic-api-staging-secrets -n ${{ env.K8S_NAMESPACE }} -o yaml || true
            kubectl get clustersecretstore aws-secrets-manager -o yaml || true
            echo "Proceeding anyway - secret may sync later or needs manual intervention..."
          fi

      - name: Check pod status
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
          echo ""
          echo "=== Pod Descriptions ==="
          for pod in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Description for $pod ---"
            kubectl describe pod -n ${{ env.K8S_NAMESPACE }} $pod || true
            echo ""
          done
          echo "=== Pod Events ==="
          kubectl get events -n ${{ env.K8S_NAMESPACE }} --field-selector involvedObject.kind=Pod --sort-by='.lastTimestamp' | tail -30
          echo ""
          echo "=== Pod Logs (Previous Container) ==="
          for pod in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Logs for $pod (previous) ---"
            kubectl logs -n ${{ env.K8S_NAMESPACE }} $pod --previous --tail=100 || true
            echo ""
            echo "--- Logs for $pod (current) ---"
            kubectl logs -n ${{ env.K8S_NAMESPACE }} $pod --tail=100 || true
            echo ""
          done

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/titanic-api-staging -n ${{ env.K8S_NAMESPACE }} --timeout=10m
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}

      - name: Run integration tests
        run: |
          SERVICE_URL=$(kubectl get ingress -n ${{ env.K8S_NAMESPACE }} titanic-api-staging -o jsonpath='{.spec.rules[0].host}')
          if [ -n "$SERVICE_URL" ]; then
            echo "Running integration tests against $SERVICE_URL"
            # Health check
            curl -f https://$SERVICE_URL/health || exit 1
            # API endpoint test
            curl -f https://$SERVICE_URL/people || echo "API test skipped"
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging deployment failed"
          fi

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_PROD }} --region ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Rollback deployment
        run: |
          helm rollback titanic-api-staging -n titanic-api-staging --wait --timeout 10m
          echo "Rollback completed"

      - name: Notify rollback
        run: |
          echo "⚠️ Staging deployment rolled back due to failure"
