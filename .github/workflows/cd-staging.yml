name: CD - Staging Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (must exist in registry)'
        required: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL || '456128143446.dkr.ecr.eu-west-2.amazonaws.com/titanic-api/titanic-api-repo' }}
  K8S_NAMESPACE: titanic-api-staging
  K8S_ENVIRONMENT: staging

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_PROD }} --region ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Determine image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            # Use latest tag
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Verify image exists in ECR
        run: |
          IMAGE_TAG=${{ steps.image-tag.outputs.tag }}
          REPO_NAME=$(echo "${{ env.ECR_REPOSITORY_URL }}" | cut -d'/' -f2-)
          IMAGE_URI="${{ env.ECR_REPOSITORY_URL }}:${IMAGE_TAG}"
          echo "Verifying image exists in ECR: ${IMAGE_URI}"
          aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag=${IMAGE_TAG} \
            --region ${{ env.AWS_REGION }} || {
              echo "Error: Image ${IMAGE_URI} not found in ECR"
              echo "Available tags:"
              aws ecr list-images --repository-name "$REPO_NAME" --region ${{ env.AWS_REGION }} --query 'imageIds[*].imageTag' --output table || true
              exit 1
            }
          echo "✓ Image verified: ${IMAGE_URI}"

      - name: Deploy to Kubernetes using Manifests
        id: deploy
        env:
          ECR_REPOSITORY_URL: ${{ env.ECR_REPOSITORY_URL }}
        run: |
          chmod +x ./scripts/deploy-manifests.sh
          ./scripts/deploy-manifests.sh \
            ${{ env.K8S_NAMESPACE }} \
            ${{ steps.image-tag.outputs.tag }} \
            ${{ env.K8S_ENVIRONMENT }} || {
              echo "Deployment failed, gathering diagnostics..."
              kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=titanic-api
              kubectl describe pods -n ${{ env.K8S_NAMESPACE }} -l app=titanic-api
              kubectl logs -n ${{ env.K8S_NAMESPACE }} -l app=titanic-api --tail=100 || true
              kubectl get events -n ${{ env.K8S_NAMESPACE }} --sort-by='.lastTimestamp' | tail -20
              exit 1
            }

      - name: Check pod status
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
          echo ""
          echo "=== Pod Descriptions ==="
          for pod in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Description for $pod ---"
            kubectl describe pod -n ${{ env.K8S_NAMESPACE }} $pod || true
            echo ""
          done
          echo "=== Pod Events ==="
          kubectl get events -n ${{ env.K8S_NAMESPACE }} --field-selector involvedObject.kind=Pod --sort-by='.lastTimestamp' | tail -30
          echo ""
          echo "=== Pod Logs (Previous Container) ==="
          for pod in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Logs for $pod (previous) ---"
            kubectl logs -n ${{ env.K8S_NAMESPACE }} $pod --previous --tail=100 || true
            echo ""
            echo "--- Logs for $pod (current) ---"
            kubectl logs -n ${{ env.K8S_NAMESPACE }} $pod --tail=100 || true
            echo ""
          done

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/titanic-api-staging -n ${{ env.K8S_NAMESPACE }} --timeout=10m
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}

      - name: Run integration tests
        run: |
          SERVICE_URL=$(kubectl get ingress -n ${{ env.K8S_NAMESPACE }} titanic-api-staging -o jsonpath='{.spec.rules[0].host}')
          if [ -n "$SERVICE_URL" ]; then
            echo "Running integration tests against $SERVICE_URL"
            # Health check
            curl -f https://$SERVICE_URL/health || exit 1
            # API endpoint test
            curl -f https://$SERVICE_URL/people || echo "API test skipped"
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment successful"
            echo ""
            echo "⚠️ IMPORTANT: Pipeline stopped for troubleshooting"
            echo "Please verify staging deployment before proceeding to production"
            echo "To deploy to production, manually trigger: CD - Production Deployment workflow"
            echo "To rollback staging, manually run: kubectl rollout undo deployment/titanic-api -n ${{ env.K8S_NAMESPACE }}"
          else
            echo "❌ Staging deployment failed"
            echo ""
            echo "⚠️ IMPORTANT: Pipeline stopped for troubleshooting"
            echo "Please investigate the failure before proceeding"
            echo "To rollback staging, manually run: kubectl rollout undo deployment/titanic-api -n ${{ env.K8S_NAMESPACE }}"
          fi

  rollback:
    name: Manual Rollback (disabled - use manual command)
    runs-on: ubuntu-latest
    needs: deploy
    if: false
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_PROD }} --region ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Rollback deployment
        run: |
          kubectl rollout undo deployment/titanic-api -n titanic-api-staging --timeout=10m
          kubectl rollout status deployment/titanic-api -n titanic-api-staging --timeout=10m
          echo "Rollback completed"

      - name: Notify rollback
        run: |
          echo "⚠️ Staging deployment rolled back due to failure"
