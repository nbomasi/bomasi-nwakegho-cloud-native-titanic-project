name: CD - Staging Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'titanic-api/**'
      - 'part-2-kubernetes/**'
      - '.github/workflows/cd-staging.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-1' }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION || 'eu-west-1' }}.amazonaws.com
  IMAGE_NAME: ${{ secrets.ECR_REPOSITORY_NAME || 'titanic-api-repo' }}
  K8S_NAMESPACE: titanic-api-staging
  K8S_ENVIRONMENT: staging

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_STAGING }} --region ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Determine image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
            echo "tag=main-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Run pre-deployment tests
        run: |
          echo "Running pre-deployment validation..."
          helm lint ./part-2-kubernetes/helm/titanic-api

      - name: Deploy to Kubernetes using Helm
        run: |
          helm upgrade --install titanic-api-staging \
            ./part-2-kubernetes/helm/titanic-api \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ steps.image-tag.outputs.tag }} \
            --set image.pullPolicy=Always \
            --set namespace=${{ env.K8S_NAMESPACE }} \
            --set config.flaskEnv=staging \
            --set replicaCount=2 \
            --set autoscaling.enabled=true \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=titanic-api-staging.example.com \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/titanic-api-staging -n ${{ env.K8S_NAMESPACE }} --timeout=10m
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}

      - name: Run integration tests
        run: |
          SERVICE_URL=$(kubectl get ingress -n ${{ env.K8S_NAMESPACE }} titanic-api-staging -o jsonpath='{.spec.rules[0].host}')
          if [ -n "$SERVICE_URL" ]; then
            echo "Running integration tests against $SERVICE_URL"
            # Health check
            curl -f http://$SERVICE_URL/health || exit 1
            # API endpoint test
            curl -f http://$SERVICE_URL/api/people || echo "API test skipped"
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging deployment failed"
          fi

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME_STAGING }} --region ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Rollback deployment
        run: |
          helm rollback titanic-api-staging -n titanic-api-staging --wait --timeout 10m
          echo "Rollback completed"

      - name: Notify rollback
        run: |
          echo "⚠️ Staging deployment rolled back due to failure"
