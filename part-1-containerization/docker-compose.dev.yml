services:
  db:
    image: postgres:15-alpine
    container_name: titanic-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-titanic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titanic_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ../titanic-api/titanic.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-titanic_user} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - titanic-network-dev

  app:
    build:
      context: ..
      dockerfile: part-1-containerization/Dockerfile.dev
    container_name: titanic-app-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-titanic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titanic_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FLASK_ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key}
    volumes:
      - ../titanic-api:/app
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    command: python run.py
    restart: unless-stopped
    networks:
      - titanic-network-dev

volumes:
  postgres_data_dev:
    driver: local

networks:
  titanic-network-dev:
    driver: bridge
