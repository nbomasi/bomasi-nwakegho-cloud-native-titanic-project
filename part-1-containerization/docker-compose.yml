services:
  db:
    image: postgres:15-alpine
    container_name: titanic-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-titanic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titanic_password}
      POSTGRES_DB: ${POSTGRES_DB:-titanic_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../titanic-api/titanic.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-titanic_user} -d ${POSTGRES_DB:-titanic_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - titanic-network

  app:
    build:
      context: ..
      dockerfile: part-1-containerization/Dockerfile
    container_name: titanic-app
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-titanic_user}:${POSTGRES_PASSWORD:-titanic_password}@db:5432/${POSTGRES_DB:-titanic_db}
      FLASK_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    networks:
      - titanic-network

volumes:
  postgres_data:
    driver: local

networks:
  titanic-network:
    driver: bridge
