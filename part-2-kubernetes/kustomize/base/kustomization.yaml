apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titanic-api

resources:
  - ../../manifests/deployment.yaml
  - ../../manifests/service.yaml  # ClusterIP service only (ingress handles external access)
  - ../../manifests/configmap.yaml
  # Note: secret.yaml is for reference only - ExternalSecret creates the actual secret from AWS Secrets Manager
  # - ../../manifests/secret.yaml
  # PVC removed - using RDS instead of pod-based database
  # - ../../manifests/pvc.yaml
  - ../../manifests/hpa.yaml
  - ../../manifests/pdb.yaml
  - ../../manifests/networkpolicy.yaml
  - ../../manifests/resourcequota.yaml
  - ../../manifests/ingress.yaml
  - ../../manifests/clusterissuer.yaml
  - ../../manifests/secretstore.yaml
  - ../../manifests/externalsecret.yaml
  - ../../manifests/grafana-ingress.yaml

commonLabels:
  app: titanic-api
  managed-by: kustomize
