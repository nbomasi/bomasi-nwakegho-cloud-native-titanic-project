apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: titanic-api-network-policy
  namespace: titanic-api
  labels:
    app: titanic-api
spec:
  podSelector:
    matchLabels:
      app: titanic-api
      component: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5000
  egress:
  # Allow egress to RDS (PostgreSQL on port 5432)
  - to: []
    ports:
    - protocol: TCP
      port: 5432
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  # Allow HTTPS for external API calls
  - to: []
    ports:
    - protocol: TCP
      port: 443
