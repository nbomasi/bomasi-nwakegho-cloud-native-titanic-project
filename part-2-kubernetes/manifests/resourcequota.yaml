apiVersion: v1
kind: ResourceQuota
metadata:
  name: titanic-api-quota
  namespace: titanic-api
  labels:
    app: titanic-api
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "1"
    services.loadbalancers: "0"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: titanic-api-limits
  namespace: titanic-api
  labels:
    app: titanic-api
spec:
  limits:
  - default:
      cpu: 500m
      memory: 1Gi
    defaultRequest:
      cpu: 100m
      memory: 512Mi
    type: Container
