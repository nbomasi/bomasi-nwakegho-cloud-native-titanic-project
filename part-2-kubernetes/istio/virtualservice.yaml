apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: titanic-api-vs
  namespace: titanic-api
  labels:
    app: titanic-api
spec:
  hosts:
  - titanic-api.example.com
  - titanic-api-dev.example.com
  - titanic-api-staging.example.com
  gateways:
  - titanic-api-gateway
  http:
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: titanic-api
        port:
          number: 80
      weight: 100
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,gateway-error,connect-failure,refused-stream
    fault:
      delay:
        percentage:
          value: 0
      abort:
        percentage:
          value: 0
    corsPolicy:
      allowOrigins:
      - exact: "*"
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - "*"
      maxAge: 24h

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: titanic-api-internal-vs
  namespace: titanic-api
  labels:
    app: titanic-api
spec:
  hosts:
  - titanic-api
  http:
  - match:
    - uri:
        prefix: "/health"
    route:
    - destination:
        host: titanic-api
        port:
          number: 80
    timeout: 5s
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: titanic-api
        port:
          number: 80
      weight: 100
    timeout: 30s
    retries:
      attempts: 2
      perTryTimeout: 10s
      retryOn: 5xx,gateway-error
