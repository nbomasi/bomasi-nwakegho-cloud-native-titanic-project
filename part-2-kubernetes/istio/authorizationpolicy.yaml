apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: titanic-api-authz
  namespace: titanic-api
  labels:
    app: titanic-api
spec:
  selector:
    matchLabels:
      app: titanic-api
      component: api
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/titanic-api/sa/titanic-api"]
    - source:
        namespaces: ["titanic-api"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths: ["/health", "/people*"]
  - from:
    - source:
        notNamespaces: ["titanic-api"]
    to:
    - operation:
        methods: ["GET"]
        paths: ["/health"]

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: titanic-db-authz
  namespace: titanic-api
  labels:
    app: titanic-api
    component: database
spec:
  selector:
    matchLabels:
      app: titanic-api
      component: database
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/titanic-api/sa/titanic-api"]
    to:
    - operation:
        ports: ["5432"]
