apiVersion: v1
kind: Secret
metadata:
  name: {{ include "titanic-api.fullname" . }}-secrets
  namespace: {{ .Values.namespace | default "titanic-api" }}
  labels:
    {{- include "titanic-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | default (printf "postgresql+psycopg2://%s:%s@%s-db:5432/%s" .Values.secrets.postgresUser .Values.secrets.postgresPassword (include "titanic-api.fullname" .) .Values.config.postgresDb) }}
  postgres-user: {{ .Values.secrets.postgresUser }}
  postgres-password: {{ .Values.secrets.postgresPassword | default "CHANGE_ME" }}
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | default "CHANGE_ME_IN_PRODUCTION" }}
