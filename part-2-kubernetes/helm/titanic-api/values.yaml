namespace: titanic-api

replicaCount: 2

image:
  repository: titanic-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullNameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 5000
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

loadBalancer:
  enabled: false
  type: LoadBalancer
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: titanic-api.iyere.site
      paths:
        - path: /
          pathType: Prefix
        - path: /health
          pathType: Exact
        - path: /people
          pathType: Prefix
  tls:
    - secretName: titanic-api-tls
      hosts:
        - titanic-api.iyere.site

grafanaIngress:
  enabled: true
  name: grafana-ingress
  namespace: monitoring
  host: monitoring.iyere.site
  tlsSecretName: grafana-tls
  serviceName: kube-prometheus-stack-grafana
  servicePort: 80

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

nodeSelector: {}

tolerations: []

affinity: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

resourceQuota:
  enabled: true
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi
  persistentvolumeclaims: "1"
  servicesLoadbalancers: "0"

limitRange:
  enabled: true
  default:
    cpu: 500m
    memory: 1Gi
  defaultRequest:
    cpu: 100m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 15
  failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

config:
  flaskEnv: production
  postgresDb: titanic_db
  appName: titanic-api
  appVersion: "1.0.0"
  logLevel: INFO

secrets:
  databaseUrl: ""
  postgresUser: titanic_user
  postgresPassword: ""
  jwtSecretKey: ""

database:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  livenessProbe:
    exec:
      command:
      - /bin/sh
      - -c
      - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    exec:
      command:
      - /bin/sh
      - -c
      - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

certManager:
  clusterIssuer:
    enabled: false
    name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    email: nbomasi@gmail.com

externalSecrets:
  secretStore:
    enabled: true
    name: aws-secrets-manager
    region: eu-west-2
    serviceAccount:
      name: external-secrets-operator
      namespace: external-secrets-system
  externalSecret:
    enabled: true
    secretName: titanic-api-prod-rds-credentials
    targetSecretName: titanic-secrets
    refreshInterval: 1h
